[package]
name = "clipbrain"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
description = "A clipboard history manager for GNOME"
license = "MIT"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_9"] }
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
env_logger = "0.11"
gtk = { version = "0.11", package = "gtk4", features = ["v4_22"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
glib-build-tools = "0.22"
